# Concierge Demo
# Run: docker-compose up

services:
  # The conversational agent (OpenClaw-powered)
  agent:
    image: ghcr.io/openclaw/openclaw:0.24
    container_name: concierge-agent
    ports:
      - "18795:18789"
    volumes:
      - .:/workspace
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped

  # Dashboard for viewing customer files + insights
  dashboard:
    build: ../dashboard
    container_name: concierge-dashboard
    ports:
      - "18796:3001"
    volumes:
      - .:/workspace
    environment:
      - WORKSPACE=/workspace
      - JAEGER_URL=http://jaeger:16686
    depends_on:
      - agent
    restart: unless-stopped

  # Optional: Jaeger for telemetry
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: concierge-jaeger
    ports:
      - "16686:16686"  # UI
      - "6831:6831/udp"  # Thrift compact
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
